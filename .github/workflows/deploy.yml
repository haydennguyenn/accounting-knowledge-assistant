name: Commit Message Check

on:
  pull_request:

jobs:
  commit-message:
    runs-on: ubuntu-latest

    steps:
      - name: Check commit messages
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          COMMITS=$(git log --format=%s origin/${{ github.base_ref }}..HEAD)

          while IFS= read -r COMMIT; do
            if [[ "$COMMIT" =~ ^(feat|fix|test|docs|chore|refactor)(\(.+\))?:\ .+ ]]; then
              echo "Valid commit: $COMMIT"
            else
              echo "Invalid commit: $COMMIT"
              echo "Expected format:"
              echo "  feat: add upload page"
              echo "  fix: correct routing"
              echo "  test: add document tests"
              echo "  docs: update README"
              echo "  chore: configure CI"
              echo "  refactor: simplify retriever"
              exit 1
            fi
          done <<< "$COMMITS"