name: Branch Name Check

on:
  pull_request:

jobs:
  check-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name
        run: |
          BRANCH_NAME="${{ github.head_ref }}"

          if [[ "$BRANCH_NAME" =~ ^(feature|fix|test|docs|chore|refactor)/[a-z0-9]+([-/][a-z0-9]+)*$ ]]; then
            echo "Branch name is valid: $BRANCH_NAME"
          else
            echo "Invalid branch name: $BRANCH_NAME"
            echo "Expected format:"
            echo "  feature/add-upload-page"
            echo "  fix/chainlit-routing"
            echo "  test/document-service"
            echo "  docs/update-readme"
            echo "  chore/setup-ci"
            echo "  refactor/rag-retriever"
            exit 1
          fi